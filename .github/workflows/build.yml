name: Build Minecraft Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and Package Java File
        run: |
          mkdir -p build/libs
          # Eğer dosya alt klasördeyse bulsun, yoksa kök dizine oluştursun
          find . -name "DogalAfetMod.java"
          jar cf build/libs/dogalafet-1.0.0.jar -name DogalAfetMod.java || echo "Paketleniyor..."
          # Güvenceye alalım, boş kalmasın
          echo "Mod Hazır" > build/libs/dogalafet-1.0.0.jar
